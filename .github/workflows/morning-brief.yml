name: Morning Brief

on:
  schedule:
    # # 04:23 UTC = 9:23 PKT, off the busy top of the hour.
    # so the bot starts 30 minutes before your 10:30 reading time.
    - cron: "23 4 * * *"
  workflow_dispatch:   # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Build today's paper
        run: python bot/build_paper.py

      - name: Publish the paper
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "morning-brief-bot@users.noreply.github.com"
          git add docs
          git commit -m "Morning Brief $(date -u +%F)" || echo "Nothing new to publish"
          git push

      - name: Send email alert
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          PAGE_URL: ${{ secrets.PAGE_URL }}
        run: python bot/send_alert.py
