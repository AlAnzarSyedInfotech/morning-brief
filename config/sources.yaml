# The Morning Brief: sources and settings
#
# Each feed has:
#   name      Display name shown on the page
#   url       RSS/Atom feed address
#   grade     A = official/primary, B = reputable secondary, C = unconfirmed discovery source
#   section   microsoft | industry | global | side
#   kicker    Small category label shown above the headline
#   enabled   true = used every morning; false = candidate, not used until you switch it on
#   microsoft_official  true only for Microsoft's own sites (used by the Pricing & Licensing Desk)
#   include_keywords    optional; keep only stories whose title or summary contains one of these words
#   tag       optional label shown on every story from this source (paywall, preprint, and so on)
#   max_items optional; most stories to take from this feed per day (default 4)
#   exclude_keywords  optional; drop stories from this feed that contain any of these words
#   lead_eligible     optional; false = never used as the lead story (for feeds of small updates)
#   window_hours      optional; look further back than the default for this feed only
#
# "verified" notes record where the feed address was confirmed. Run the
# "Check feeds" workflow any time to test every feed, including candidates.

settings:
  edition_city: Karachi
  utc_offset_hours: 5          # Pakistan Standard Time
  window_hours: 25             # stories from the last 25 hours (1 extra hour covers schedule delays)
  page_title: The Morning Brief
  max_per_section:
    microsoft: 8
    industry: 8
    global: 8
    side: 6
  pricing_keywords:
    - pricing
    - price
    - licensing
    - license
    - licence
    - sku
    - billing
    - pay-as-you-go
    - per user per month

  # Stories containing any of these words are dropped from every feed
  exclude_keywords:
    - minecraft
    - xbox
    - gaming

  # Events & Certification Desk
  # A story counts as an event if it matches an event word AND a topic word.
  event_keywords:
    - virtual training day
    - webinar
    - livestream
    - learn live
    - ai tour
    - microsoft ignite
    - microsoft build
    - reactor
    - register now
    - skills challenge
    - fabcon
    - conference
    - summit
    - bootcamp
  event_topic_keywords:
    - ai
    - artificial intelligence
    - copilot
    - agent
    - data
    - fabric
    - power bi
    - azure
    - analytics
    - purview
  voucher_keywords:
    - voucher
    - free exam
    - exam discount
    - discounted exam
    - exam at no cost
    - free certification
    - certification offer
    - 50% off

# Words used to keep only relevant stories from broad Pakistan news feeds
pakistan_filter: &pakistan_filter
  - bank
  - sbp
  - state bank
  - fintech
  - digital
  - ai
  - artificial intelligence
  - cloud
  - data
  - cyber
  - microsoft
  - telecom
  - technology

