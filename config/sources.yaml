# ---------------- Page watches ----------------
# For pages with no RSS feed. Each morning the bot reads the page, keeps lines
# that contain a keyword, and shows any line that is new since the last run.
# The first run only records a starting point, so nothing shows until day 2.
page_watches:
  - name: Microsoft Virtual Training Days
    url: https://www.microsoft.com/en-us/trainingdays
    keywords: [ai, copilot, data, fabric, power bi, azure, agent, exam, certification, voucher]
    enabled: true
    verified: address seen in a third-party guide (cloudlabs.ai); the page may load its event list with JavaScript, in which case nothing will be found. Confirm with Check feeds.
